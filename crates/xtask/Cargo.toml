[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anamnez-core = { workspace = true, features = ["test-support"] }
anamnez-protocol = { workspace = true }

# DB
rusqlite = { workspace = true }

# Cert minting + parsing for the dev workstation cert.
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
sha2 = { workspace = true }

# HTTP client for dev-seed
reqwest = { workspace = true }
tokio = { workspace = true }

# Misc
serde = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
jiff = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
