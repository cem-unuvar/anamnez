[package]
name = "anamnez-protocol"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
jiff = { workspace = true }
uuid = { version = "1", default-features = false, features = ["serde"] }
thiserror = { workspace = true }

# Optional: native-only daemon enables this to get From<core::X> for protocol::X.
anamnez-core = { workspace = true, optional = true }

[features]
default = []
from-core = ["dep:anamnez-core"]
